# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: leash
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: groq
      # Secrets: you are prompted for these in the Render dashboard; they are never committed.
      - key: GROQ_API_KEY
        sync: false
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_RECEIVER
        sync: false
